        <h1><center>擬宝珠</center></h1>

<p>
お寺や神社、橋の欄干などで見られる玉ねぎ型の装飾は、「宝珠（ほうじゅ）」、または「擬宝珠（ぎぼし）」と呼ばれる。
</p>

<center><img src="images/giboshi.png"></center>

<h3>関連項目</h3>

<p style="padding-left:1em;">
<strong>ルコビッツァ</strong>
</p>
<p>
ロシアの建築物に見られる玉ねぎ型のドームは、ロシア語でルコビッツァ（lukovitsa / луковица）と呼ばれる。<br>
ロシア語でドーム全般を指す「クーポル（kupol / купол）」とも呼ばれる。<br>
<a href="https://www.chenarch.com/Lecture-07.html">https://www.chenarch.com/Lecture-07.html</a>
</p>
