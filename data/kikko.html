        <h1><center>亀甲金網 (きっこうかなあみ)</center></h1>

<center><img src="images/kikko_kanaami.png"></center>
<p>
針金を六角形の形に編んだ金網は、亀甲金網 (きっこうかなあみ)と呼ばれる。
</p>

<h3>AIモードによれば･･･</h3>

<p>
日本でいつ頃から造られ始めたかは正確には不明ですが、1615年（元和元年）に建てられた大阪府羽曳野市の吉村邸（重要文化財）の納屋の窓に銅製の亀甲金網が使われており、これが国内最古の例とされています。
</p>

<p>
線をねじり合わせる構造のため、一箇所が切れても網目全体が崩れにくいという特徴があります。
</p>
